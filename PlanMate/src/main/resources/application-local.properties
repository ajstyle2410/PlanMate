# ----------------------------------------------------------------------------
# LOCAL DEVELOPMENT CONFIGURATION
# ----------------------------------------------------------------------------
# This file provides default values for local development
# Copy this to application.properties or set environment variables
# ----------------------------------------------------------------------------

# DataSource configuration - H2 In-Memory Database (for local testing)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:planmate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=create-drop
hibernate.archive.autodetection=class,hbm
hibernate.enable_lazy_load_no_trans=true
hibernate.temp.use_jdbc_metadata_defaults=false
hibernate.jdbc.lob.non_contextual_creation=true

