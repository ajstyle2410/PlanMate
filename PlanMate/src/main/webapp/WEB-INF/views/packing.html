<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing List - PlanMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] {
            display: none !important;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body class="bg-gray-50">

    <div x-data="packingApp()" x-cloak>

        <!-- Navigation -->
        <nav class="bg-white shadow-lg sticky top-0 z-50">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center space-x-3">
                        <a th:href="@{/}" class="flex items-center space-x-3">
                            <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center">
                                <i class="fas fa-plane text-white text-xl"></i>
                            </div>
                            <span
                                class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">PlanMate</span>
                        </a>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a th:href="@{/userdashboard/{username}(username=${userProfile.username})}"
                            class="text-gray-600 hover:text-blue-600">
                            <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">

            <!-- Header -->
            <div class="mb-8">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-4xl font-bold text-gray-800 mb-2">Packing List</h1>
                        <p class="text-gray-600" th:text="${trip.title}">Trip Title</p>
                    </div>
                    <button @click="showAddItem = true"
                        class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-3 rounded-lg hover:shadow-lg transition-all">
                        <i class="fas fa-plus mr-2"></i>Add Item
                    </button>
                </div>
            </div>

            <!-- Feature Navigation Tabs -->
            <div class="bg-white rounded-xl shadow-md p-4 mb-6">
                <div class="flex flex-wrap gap-2">
                    <a th:href="@{/trips/{id}/itinerary(id=${trip.tripId})}"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-calendar-alt mr-2"></i>Itinerary
                    </a>
                    <a th:href="@{/trips/{id}/budget(id=${trip.tripId})}"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-wallet mr-2"></i>Budget
                    </a>
                    <a th:href="@{/trips/{id}/accommodations(id=${trip.tripId})}"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-hotel mr-2"></i>Accommodations
                    </a>
                    <a th:href="@{/trips/{id}/transportation(id=${trip.tripId})}"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-plane mr-2"></i>Transportation
                    </a>
                    <a th:href="@{/trips/{id}/packing(id=${trip.tripId})}"
                        class="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg font-medium">
                        <i class="fas fa-suitcase mr-2"></i>Packing
                    </a>
                    <a th:href="@{/trips/{id}/documents(id=${trip.tripId})}"
                        class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-file-alt mr-2"></i>Documents
                    </a>
                </div>
            </div>

            <!-- Progress Bar -->
            <div th:if="${!packingItems.isEmpty()}" class="bg-white rounded-xl shadow-md p-6 mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-lg font-bold text-gray-800">Packing Progress</h3>
                    <span class="text-2xl font-bold text-blue-600"
                        th:text="${#numbers.formatDecimal(progress, 1, 0)} + '%'">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div class="bg-gradient-to-r from-purple-600 to-blue-600 h-4 rounded-full transition-all"
                        th:style="'width: ' + ${progress} + '%'"></div>
                </div>
                <p class="text-sm text-gray-600 mt-2">
                    <span th:text="${packedItems}">0</span> of <span th:text="${totalItems}">0</span> items packed
                </p>
            </div>

            <!-- Packing List -->
            <div th:if="${packingItems.isEmpty()}" class="bg-white rounded-xl shadow-md p-12 text-center">
                <i class="fas fa-suitcase text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-2xl font-bold text-gray-700 mb-2">No Packing Items Yet</h3>
                <p class="text-gray-500 mb-6">Create your packing checklist for the trip</p>
                <button @click="showAddItem = true"
                    class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-3 rounded-lg hover:shadow-lg transition-all">
                    <i class="fas fa-plus mr-2"></i>Add First Item
                </button>
            </div>

            <div th:if="${!packingItems.isEmpty()}" class="space-y-6">
                <!-- Group by Category -->
                <div th:each="entry : ${itemsByCategory}" class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-4">
                        <h3 class="text-xl font-bold" th:text="${entry.key}">Category</h3>
                    </div>

                    <div class="p-4 space-y-2">
                        <div th:each="item : ${entry.value}"
                            class="flex items-center space-x-3 p-3 hover:bg-gray-50 rounded-lg">
                            <!-- Checkbox -->
                            <form
                                th:action="@{/trips/{tripId}/packing/{itemId}/toggle(tripId=${trip.tripId},itemId=${item.id})}"
                                method="post" style="display:inline;">
                                <button type="submit" class="focus:outline-none">
                                    <div th:if="${item.isPacked}"
                                        class="w-6 h-6 bg-green-500 rounded flex items-center justify-center">
                                        <i class="fas fa-check text-white text-sm"></i>
                                    </div>
                                    <div th:unless="${item.isPacked}"
                                        class="w-6 h-6 border-2 border-gray-300 rounded hover:border-blue-500"></div>
                                </button>
                            </form>

                            <!-- Item Details -->
                            <div class="flex-1">
                                <div class="flex items-center space-x-2">
                                    <span
                                        th:classappend="${item.isPacked} ? 'line-through text-gray-400' : 'text-gray-800'"
                                        class="font-medium" th:text="${item.itemName}">Item</span>
                                    <span th:if="${item.quantity > 1}"
                                        class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full">
                                        x<span th:text="${item.quantity}">1</span>
                                    </span>
                                    <span th:if="${item.priority}" th:classappend="${item.priority.name() == 'ESSENTIAL'} ? 'bg-red-100 text-red-700' : 
                                                          ${item.priority.name() == 'IMPORTANT'} ? 'bg-orange-100 text-orange-700' : 
                                                          'bg-gray-100 text-gray-700'"
                                        class="text-xs px-2 py-1 rounded-full"
                                        th:text="${item.priority}">Priority</span>
                                </div>
                                <p th:if="${item.notes}" class="text-sm text-gray-500 mt-1" th:text="${item.notes}">
                                    Notes</p>
                            </div>

                            <!-- Delete Button -->
                            <a th:href="@{/trips/{tripId}/packing/{itemId}/delete(tripId=${trip.tripId},itemId=${item.id})}"
                                onclick="return confirm('Delete this item?')" class="text-red-500 hover:text-red-700">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Add Item Modal -->
        <div x-show="showAddItem" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
            @click.self="showAddItem = false">
            <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4">
                <h3 class="text-2xl font-bold mb-4">Add Packing Item</h3>
                <form th:action="@{/trips/{id}/packing/add(id=${trip.tripId})}" method="post">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Item Name *</label>
                            <input type="text" name="itemName" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select name="category"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="">Select category</option>
                                <option value="CLOTHING">Clothing</option>
                                <option value="TOILETRIES">Toiletries</option>
                                <option value="ELECTRONICS">Electronics</option>
                                <option value="DOCUMENTS">Documents</option>
                                <option value="MEDICATIONS">Medications</option>
                                <option value="ACCESSORIES">Accessories</option>
                                <option value="FOOTWEAR">Footwear</option>
                                <option value="OUTDOOR_GEAR">Outdoor Gear</option>
                                <option value="ENTERTAINMENT">Entertainment</option>
                                <option value="FOOD_SNACKS">Food & Snacks</option>
                                <option value="BABY_ITEMS">Baby Items</option>
                                <option value="PET_SUPPLIES">Pet Supplies</option>
                                <option value="SPORTS_EQUIPMENT">Sports Equipment</option>
                                <option value="MISCELLANEOUS">Miscellaneous</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                            <input type="number" name="quantity" value="1" min="1"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                            <select name="priority"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="NORMAL">Normal</option>
                                <option value="ESSENTIAL">Essential</option>
                                <option value="IMPORTANT">Important</option>
                                <option value="OPTIONAL">Optional</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                            <textarea name="notes" rows="2"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                    </div>
                    <div class="flex space-x-3 mt-6">
                        <button type="submit"
                            class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Add
                            Item</button>
                        <button type="button" @click="showAddItem = false"
                            class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        function packingApp() {
            return {
                showAddItem: false
            }
        }
    </script>

</body>

</html>
