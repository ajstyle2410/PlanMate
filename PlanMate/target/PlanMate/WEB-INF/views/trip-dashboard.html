<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Dashboard - PlanMate</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        [x-cloak] {
            display: none !important;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-gray-50">

    <div x-data="tripDashboard()" x-cloak>

        <!-- Include Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">

            <!-- Header -->
            <div
                class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 space-y-4 md:space-y-0">
                <div>
                    <h1 class="text-4xl font-bold text-gray-800">My Trips</h1>
                    <p class="text-gray-600 mt-2">Plan and manage all your adventures</p>
                </div>
                <button @click="showNewTripModal = true"
                    class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-3 rounded-lg hover:shadow-lg transition-all flex items-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>New Trip</span>
                </button>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-blue-500 card-hover transition-all">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm font-medium">Total Trips</p>
                            <p class="text-3xl font-bold text-gray-800 mt-2" x-text="stats.totalTrips">0</p>
                            <p class="text-xs text-green-600 mt-1">
                                <i class="fas fa-arrow-up"></i> 12% from last month
                            </p>
                        </div>
                        <div class="bg-blue-100 rounded-full p-4">
                            <i class="fas fa-suitcase text-blue-600 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-green-500 card-hover transition-all">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm font-medium">Active Trips</p>
                            <p class="text-3xl font-bold text-gray-800 mt-2" x-text="stats.activeTrips">0</p>
                            <p class="text-xs text-gray-500 mt-1">Currently ongoing</p>
                        </div>
                        <div class="bg-green-100 rounded-full p-4">
                            <i class="fas fa-plane-departure text-green-600 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-purple-500 card-hover transition-all">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm font-medium">Total Budget</p>
                            <p class="text-3xl font-bold text-gray-800 mt-2"
                                x-text="'$' + stats.totalBudget.toLocaleString()">$0</p>
                            <p class="text-xs text-gray-500 mt-1">Across all trips</p>
                        </div>
                        <div class="bg-purple-100 rounded-full p-4">
                            <i class="fas fa-dollar-sign text-purple-600 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-orange-500 card-hover transition-all">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm font-medium">Destinations</p>
                            <p class="text-3xl font-bold text-gray-800 mt-2" x-text="stats.destinations">0</p>
                            <p class="text-xs text-gray-500 mt-1">Places to explore</p>
                        </div>
                        <div class="bg-orange-100 rounded-full p-4">
                            <i class="fas fa-map-marked-alt text-orange-600 text-2xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter and Search -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                    <div class="flex-1">
                        <input type="text" x-model="searchQuery" placeholder="Search trips..."
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <select x-model="filterStatus"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">All Status</option>
                        <option value="DRAFT">Draft</option>
                        <option value="ACTIVE">Active</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                    <select x-model="sortBy"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="date">Sort by Date</option>
                        <option value="name">Sort by Name</option>
                        <option value="budget">Sort by Budget</option>
                    </select>
                </div>
            </div>

            <!-- Trips Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="trip in filteredTrips" :key="trip.id">
                    <div class="bg-white rounded-xl shadow-md overflow-hidden card-hover transition-all cursor-pointer">
                        <!-- Trip Image -->
                        <div class="h-48 bg-gradient-to-r from-purple-400 to-blue-500 relative">
                            <img :src="trip.image" :alt="trip.title" class="w-full h-full object-cover">
                            <div class="absolute top-4 right-4">
                                <span :class="{
                                    'bg-green-500': trip.status === 'ACTIVE',
                                    'bg-yellow-500': trip.status === 'DRAFT',
                                    'bg-gray-500': trip.status === 'COMPLETED'
                                }" class="text-white text-xs px-3 py-1 rounded-full" x-text="trip.status"></span>
                            </div>
                        </div>

                        <!-- Trip Details -->
                        <div class="p-6">
                            <h3 class="font-bold text-xl text-gray-800 mb-2" x-text="trip.title"></h3>
                            <p class="text-gray-600 text-sm mb-4" x-text="trip.description"></p>

                            <div class="space-y-2 text-sm text-gray-600">
                                <div class="flex items-center">
                                    <i class="far fa-calendar w-5 text-blue-600"></i>
                                    <span x-text="trip.startDate + ' - ' + trip.endDate"></span>
                                </div>
                                <div class="flex items-center">
                                    <i class="fas fa-map-marker-alt w-5 text-red-600"></i>
                                    <span x-text="trip.destinations + ' destinations'"></span>
                                </div>
                                <div class="flex items-center">
                                    <i class="fas fa-dollar-sign w-5 text-green-600"></i>
                                    <span x-text="'$' + trip.budget.toLocaleString()"></span>
                                </div>
                            </div>

                            <div class="mt-4 pt-4 border-t flex justify-between items-center">
                                <button @click="viewTrip(trip.id)"
                                    class="text-blue-600 hover:text-blue-700 font-medium">
                                    View Details <i class="fas fa-arrow-right ml-1"></i>
                                </button>
                                <div class="flex space-x-2">
                                    <button @click="editTrip(trip.id)" class="text-gray-600 hover:text-gray-800">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button @click="deleteTrip(trip.id)" class="text-red-600 hover:text-red-800">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Empty State -->
            <div x-show="filteredTrips.length === 0" class="text-center py-16">
                <i class="fas fa-suitcase text-gray-300 text-6xl mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-600 mb-2">No trips found</h3>
                <p class="text-gray-500 mb-6">Start planning your next adventure!</p>
                <button @click="showNewTripModal = true"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    Create Your First Trip
                </button>
            </div>

        </main>

        <!-- Include Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

    <script>
        function tripDashboard() {
            return {
                showNewTripModal: false,
                searchQuery: '',
                filterStatus: '',
                sortBy: 'date',
                stats: {
                    totalTrips: 12,
                    activeTrips: 3,
                    totalBudget: 15200,
                    destinations: 28
                },
                trips: [
                    {
                        id: 1,
                        title: 'Summer Europe Tour',
                        description: 'Exploring the best of Europe',
                        startDate: 'Jun 15, 2025',
                        endDate: 'Jun 29, 2025',
                        destinations: 3,
                        budget: 5200,
                        status: 'ACTIVE',
                        image: 'https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=400'
                    },
                    {
                        id: 2,
                        title: 'Tokyo Adventure',
                        description: 'Experience Japanese culture',
                        startDate: 'Aug 10, 2025',
                        endDate: 'Aug 20, 2025',
                        destinations: 2,
                        budget: 4500,
                        status: 'DRAFT',
                        image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=400'
                    }
                ],
                get filteredTrips() {
                    let filtered = this.trips;

                    if (this.searchQuery) {
                        filtered = filtered.filter(trip =>
                            trip.title.toLowerCase().includes(this.searchQuery.toLowerCase())
                        );
                    }

                    if (this.filterStatus) {
                        filtered = filtered.filter(trip => trip.status === this.filterStatus);
                    }

                    return filtered;
                },
                viewTrip(id) {
                    window.location.href = `/trip/${id}`;
                },
                editTrip(id) {
                    window.location.href = `/trip/${id}/edit`;
                },
                deleteTrip(id) {
                    if (confirm('Are you sure you want to delete this trip?')) {
                        // Delete logic here
                    }
                }
            }
        }
    </script>

</body>

</html>
