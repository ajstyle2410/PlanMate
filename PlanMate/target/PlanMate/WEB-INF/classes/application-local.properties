# Local Development Configuration (MySQL)
# Copy this file to application-local.properties and update with your local settings

# ========================================
# Database Configuration (MySQL)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/planmet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=rootplanmet
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Enable lazy loading without transaction (for development only)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.org.planmet=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# Server Configuration
# ========================================
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# ========================================
# Thymeleaf Configuration
# ========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# CORS Configuration
# ========================================
allowed.origins=http://localhost:3000,http://localhost:4200

# ========================================
# Application Configuration
# ========================================
spring.application.name=PlanMate
app.version=1.0.0
