# ----------------------------------------------------------------------------
# DataSource configuration
# ----------------------------------------------------------------------------
# IMPORTANT: Database credentials can be provided via environment variables
# For PRODUCTION (Render, AWS, etc.):
#   DB_URL or SPRING_DATASOURCE_URL - Database connection URL
#   DB_USERNAME or SPRING_DATASOURCE_USERNAME - Database username
#   DB_PASSWORD or SPRING_DATASOURCE_PASSWORD - Database password
# For LOCAL DEVELOPMENT: Uses H2 in-memory database by default
# ----------------------------------------------------------------------------
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/planmate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.database-platform=${HIBERNATE_DIALECT:${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}}

# ----------------------------------------------------------------------------
# Shared Hibernate options
# ----------------------------------------------------------------------------
hibernate.show_sql=true
hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
hibernate.hbm2ddl.auto=update
hibernate.archive.autodetection=class,hbm
hibernate.enable_lazy_load_no_trans=true
# Keep JDBC metadata lookup lightweight for managed services
hibernate.temp.use_jdbc_metadata_defaults=false
hibernate.jdbc.lob.non_contextual_creation=true
